name: Verify and publish Starsilk Command

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate deterministic engine
        run: npm test
      - name: Check required game assets
        run: |
          test -s index.html
          test -s styles.css
          test -s src/main.js
          test -s src/engine.js
          test -s src/scenarios.js
          test -s manifest.webmanifest
          test -s sw.js

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare public static site
        run: |
          mkdir -p _site/src
          cp index.html styles.css icon.svg manifest.webmanifest sw.js .nojekyll _site/
          cp src/*.js _site/src/
          sed -i "s/starsilk-command-shell-1/starsilk-command-shell-${GITHUB_SHA:0:12}/" _site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
